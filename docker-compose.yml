services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: quranic-studio:latest
    container_name: quranic-studio
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # Persist the SQLite database across restarts
      - quranic_data:/app/data
      # Persist generated output videos
      - quranic_output:/app/output
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  quranic_data:
    driver: local
  quranic_output:
    driver: local
