name: Deploy Quranic Studio to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2 # نسخة محدثة متوافقة تماماً

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SERVER_SSH_KEY }}" | sed 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0 # نسخة محدثة متوافقة تماماً
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key_path: ~/.ssh/deploy_key
          script: |
            cd /app
            echo "📥 سحب الكود الجديد..."
            git pull origin main

            echo "🐳 إعادة بناء وتشغيل الـ Containers..."
            docker compose up -d --build

            echo "🧹 تنظيف الـ Images القديمة لتوفير المساحة..."
            docker image prune -f

            echo "✅ تم التحديث بنجاح!"
